name: Deploy openscientist (staging)

on:
  push:
    branches: [ "staging" ]
  workflow_dispatch:

concurrency:
  # Serialize deploys per env: az vm run-command allows only one execution per VM
  # at a time, so overlapping runs (e.g. batch-merges to main) hit a Conflict and
  # fail. Queue them instead of racing; never cancel an in-flight deploy midway.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build base + main image in ACR
        run: |
          ACR=${{ secrets.ACR_NAME }}
          # Transient registry errors ("failed to get layer ... layer does not
          # exist") showed up when a dependent build raced the base tag that had
          # just been overwritten in this same run. Retry rather than fail a deploy
          # on it; the identical build succeeds on a second attempt.
          acr_build() {
            for attempt in 1 2 3; do
              az acr build -r $ACR "$@" && return 0
              echo "acr build failed (attempt $attempt), retrying in 30s" >&2
              sleep 30
            done
            return 1
          }
          acr_build -t openscientist-base:latest -f Dockerfile.base .
          # Pin every dependent image to the exact base just built, so they cannot
          # resolve a half-replicated :latest and cannot drift apart from one
          # another when the base is rebuilt between steps.
          BASE_DIGEST=$(az acr repository show -n $ACR --image openscientist-base:latest --query digest -o tsv)
          sed -i "s|^FROM openscientist-base:latest|FROM ${ACR}.azurecr.io/openscientist-base@${BASE_DIGEST}|" Dockerfile Dockerfile.agent Dockerfile.executor
          # The agent and executor images run the same src/ as the web image but
          # were only ever built by hand, so they froze on a June build while the
          # web image kept shipping. The key-replacement proxy landed after that
          # build, so the agent ignored the proxy, sent the runner's placeholder
          # key straight to Azure, and failed every job with a 401 that reads
          # like a bad credential. Building them here keeps the halves in step.
          #
          # The tag is per environment, never :latest. All three environments
          # previously shared openscientist-agent:latest, so a dev deploy would
          # have replaced the image prod runs. Each VM's compose pins its own tag.
          acr_build -t openscientist-agent:staging -f Dockerfile.agent .
          acr_build -t openscientist-executor:staging -f Dockerfile.executor .
          TAG=staging-${{ github.sha }}
          acr_build -t openscientist:$TAG -f Dockerfile .
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Redeploy on vm-openscientist-stg
        run: |
          ACR=${{ secrets.ACR_NAME }}
          FULL=${ACR}.azurecr.io/openscientist:${{ env.TAG }}
          TOK=$(az acr login -n $ACR --expose-token --query accessToken -o tsv)
          # The image ships migrations but nothing applied them, so a release
          # carrying a schema change left the database behind and every query
          # touching a new column failed at runtime. Migrating between the pull
          # and the restart means the new code never starts against an old
          # schema, and a failed migration aborts the deploy with the previous
          # container still serving.
          az vm run-command invoke -g rg-openscientist-staging -n vm-openscientist-stg --command-id RunShellScript --scripts "docker login ${ACR}.azurecr.io -u 00000000-0000-0000-0000-000000000000 -p '$TOK' && sed -i 's|image: acrcbraindev.azurecr.io/openscientist:.*|image: $FULL|' /opt/openscientist/docker-compose.yml && cd /opt/openscientist && docker compose pull openscientist && docker compose run --rm openscientist alembic upgrade head && docker compose up -d openscientist"
